# Production compose — built and deployed by the Jenkins pipeline.
#
# Differences from docker-compose.yml, which is the hot-reload preview:
#   * production build targets, so images are the standalone/gunicorn builds
#   * no bind mounts — the image is the artefact
#   * no published ports — Traefik is the only ingress
#   * nginx is the Traefik-facing service; it already owns the / and /api split
#
# DOMAIN_NAME and ROUTER_PREFIX come from the deploy environment. ROUTER_PREFIX
# must be unique per deployment: Traefik router names are global, so two
# projects sharing a prefix will silently steal each other's traffic.

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 10s
  # Cold starts are slow on first deploy; a short start_period marks a healthy
  # container as failed before it has finished booting.
  start_period: 60s
  retries: 5

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - traefik-public
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      <<: *healthcheck-defaults
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.${ROUTER_PREFIX}-app.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-app.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX}-app.tls=true"
      - "traefik.http.routers.${ROUTER_PREFIX}-app.tls.certresolver=myresolver"
      # HTTP router — required for ACME cert issuance, then redirects
      - "traefik.http.routers.${ROUTER_PREFIX}-app-http.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.${ROUTER_PREFIX}-app-http.entrypoints=web"
      - "traefik.http.routers.${ROUTER_PREFIX}-app-http.middlewares=${ROUTER_PREFIX}-redirect-https"
      - "traefik.http.middlewares.${ROUTER_PREFIX}-redirect-https.redirectscheme.scheme=https"
      # Service port, and which network Traefik should reach it on. The network
      # label is required because this container is on two of them.
      - "traefik.http.services.${ROUTER_PREFIX}-app.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      # The standalone server binds 127.0.0.1 unless told otherwise, which
      # makes it unreachable from nginx.
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_SITE_NAME=${SITE_NAME:-42d6f3fc-6853-4abf-a5bf-9e132af66c77}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      <<: *healthcheck-defaults
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      - PORT=8000
      - ENV=production
      - CORS_ORIGINS=https://${DOMAIN_NAME}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-app_user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-app_db}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-app_db}
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      # prefer, not disable — the app rejects disable when ENV=production
      - POSTGRES_SSLMODE=prefer
      - SITE_NAME=${SITE_NAME:-42d6f3fc-6853-4abf-a5bf-9e132af66c77}
      - FRONTEND_URL=https://${DOMAIN_NAME}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      <<: *healthcheck-defaults
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-app_user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-app_db}
      - POSTGRES_SSLMODE=prefer
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-app_db}
      - POSTGRES_USER=${DB_USER:-app_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge

volumes:
  db_data:
